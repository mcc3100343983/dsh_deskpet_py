name: open-pr

# 一次性工作流：仅用于通过 GitHub API 创建 PR（沙箱只有 SSH 部署密钥，无法直接调 REST API）。
# 触发后即可删除本分支。

on:
  push:
    branches:
      - ci/open-pr

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @.github/pr-body.json \
            -w "\n--- HTTP %{http_code} ---\n" \
            https://api.github.com/repos/mcc3100343983/dsh_deskpet_py/pulls
