name: open-pr

# 一次性工作流：仅用于通过 GitHub API 创建 PR（沙箱只有 SSH 密钥，无法直接调 REST API）。
# 触发后即可删除本分支。

on:
  push:
    branches:
      - ci/open-pr

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create pull request
        run: |
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @.github/pr-body.json \
            https://api.github.com/repos/mcc3100343983/dsh_deskpet_py/pulls)

          echo "HTTP $code"
          cat /tmp/resp.json

          {
            echo "### PR creation result"
            echo ""
            echo "HTTP code: \`$code\`"
            echo ""
            echo '```json'
            cat /tmp/resp.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cp /tmp/resp.json .github/pr-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr-result.json
          git commit -m "ci: PR creation result [skip ci]" || true
          git push origin HEAD:ci/open-pr-result --force
